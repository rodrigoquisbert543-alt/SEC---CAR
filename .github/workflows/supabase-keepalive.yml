name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Este flujo hace una consulta liviana dos veces por semana para evitarlo.
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "::error::Configura los secretos SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/ingresos?select=id&limit=1" > /dev/null
