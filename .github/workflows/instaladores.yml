name: Construir instaladores

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['desktop/**', 'mobile/**', '.github/workflows/instaladores.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/SEC-CAR-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
        working-directory: mobile
      - run: npx cap add android
        working-directory: mobile
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk SEC-CAR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SEC-CAR.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: salida, merge-multiple: true }
      - name: Publicar en la release "instaladores"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view instaladores >/dev/null 2>&1 || gh release create instaladores --title "Instaladores SEC-CAR" --notes "Instaladores de escritorio y Android"
          gh release upload instaladores salida/SEC-CAR-Setup.exe salida/SEC-CAR.apk --clobber
